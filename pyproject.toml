[project]
name = "ship"
version = "0.1.0"
description = "Publish an HTML file to one of your Cloudflare domains with one command."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",    # command-line parsing (and `rich` for pretty output)
    "httpx>=0.27",    # HTTP client for the Cloudflare REST API
    "boto3>=1.35",    # S3 client, which also speaks to Cloudflare R2
    "keyring>=25",    # stores the API token in the macOS Keychain
]

[project.scripts]
# Installing the package creates a `ship` command that calls ship/cli.py:main()
ship = "ship.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ship"]
